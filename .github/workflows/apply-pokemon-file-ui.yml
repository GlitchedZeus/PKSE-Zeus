name: Apply Pokemon file UI integration

on:
  push:
    branches:
      - feature/pokemon-file-import-export

permissions:
  contents: write

jobs:
  apply-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pokemon-file-import-export
          fetch-depth: 0

      - name: Apply exact UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          screen_path = Path('src/UI/TrainerViewScreen.cpp')
          text = screen_path.read_text()

          text = replace_once(
              text,
              '#include "Trainer/Trainer3RSE.h" // hoennLayout(): Ruby/Sapphire and Emerald size their pouches differently\n',
              '#include "Trainer/Trainer3RSE.h" // hoennLayout(): Ruby/Sapphire and Emerald size their pouches differently\n'
              '#include "Trainer/PokemonFile.h" // standalone .pk*/.pb*/.pa* import/export\n',
              'PokemonFile include')

          old_browser = '''    void TrainerViewScreen::openPKSMImportBrowser()
    {
        if (!bank)
            return;
        pksmImport.reset();
        // Start where the file most likely is. PKSM keeps banks under /3ds/PKSM/banks on the SD
        // card, and its own backup feature mirrors the extdata layout one level deeper -- both are
        // worth trying before dropping the user at the root of a card with hundreds of folders.
        // Every candidate is probed for existence, so a card without PKSM on it just opens at the root.
        fileBrowserPurpose = FileBrowserPurpose::PKSMBank;
        fileBrowser.open("Select a PKSM Bank File",
                         {"sdmc:/3ds/PKSM/banks",
                          "sdmc:/3ds/PKSM/extDataBackup/banks",
                          "sdmc:/3ds/PKSM",
                          "sdmc:/PKSM/banks",
                          "sdmc:/PKSE"},
                         {".bnk", ".bin"}); // .bin catches a hand-copied pre-2019 bank.bin, which is named on sight
        Utils::logEventToFile("PKSMIMPORT action=BROWSE dir=\\\"" + fileBrowser.directory + "\\\"");
    }
'''
          new_browser = '''    void TrainerViewScreen::openPKSMImportBrowser()
    {
        if (!bank)
            return;
        pksmImport.reset();
        // One import browser handles both PKSM bank containers and native standalone Pokemon
        // records. Native files land in the in-memory PKSE Bank first, so the Storage view's normal
        // Save/Discard prompt remains the only persistence decision.
        fileBrowserPurpose = FileBrowserPurpose::PKSMBank;
        std::vector<std::string> importExtensions = Trainer::PokemonFile::extensions();
        importExtensions.push_back(".bnk");
        importExtensions.push_back(".bin"); // hand-copied pre-2019 PKSM bank.bin
        fileBrowser.open("Import Pokemon / PKSM Bank",
                         {"sdmc:/PKSE/exports",
                          "sdmc:/PKSE",
                          "sdmc:/3ds/PKSM/banks",
                          "sdmc:/3ds/PKSM/extDataBackup/banks",
                          "sdmc:/3ds/PKSM",
                          "sdmc:/PKSM/banks",
                          "sdmc:/"},
                         importExtensions);
        Utils::logEventToFile("IMPORT action=BROWSE dir=\\\"" + fileBrowser.directory + "\\\"");
    }
'''
          text = replace_once(text, old_browser, new_browser, 'import browser')

          old_activate = '''        if (activate && fileBrowser.activate())
        {
            const std::string picked = fileBrowser.chosenPath;
            fileBrowser.chosenPath.clear();
            if (fileBrowserPurpose == FileBrowserPurpose::TradePartner)
                tradeEvolveWithChosenSave(picked);
            else
                scanChosenPKSMBank(picked);
        }
'''
          new_activate = '''        if (activate && fileBrowser.activate())
        {
            const std::string picked = fileBrowser.chosenPath;
            fileBrowser.chosenPath.clear();
            if (fileBrowserPurpose == FileBrowserPurpose::TradePartner)
            {
                tradeEvolveWithChosenSave(picked);
            }
            else if (Trainer::PokemonFile::supportsFileName(picked))
            {
                size_t importBox = 0, importSlot = 0;
                std::string error;
                if (bank && Trainer::PokemonFile::importIntoBank(*bank, picked, &importBox, &importSlot, &error))
                {
                    stBankBox = static_cast<int>(importBox);
                    stBankSlot = static_cast<int>(importSlot);
                    storageFocusPane = 1;
                    fileBrowser.close();
                    pksmImport.reset();
                    postStatus("Pokemon imported - choose Save when you leave Storage.", 480);
                    Utils::logEventToFile("POKEMONFILE action=IMPORT result=OK file=\\\"" + leafName(picked) +
                                          "\\\" box=" + std::to_string(importBox + 1) +
                                          " slot=" + std::to_string(importSlot + 1));
                }
                else
                {
                    const std::string reason = error.empty() ? "could not read Pokemon file" : error;
                    postStatus("Import failed: " + reason, 480);
                    Utils::logEventToFile("POKEMONFILE action=IMPORT result=FAILED file=\\\"" + leafName(picked) +
                                          "\\\" reason=\\\"" + reason + "\\\"");
                }
            }
            else
            {
                scanChosenPKSMBank(picked);
            }
        }
'''
          text = replace_once(text, old_activate, new_activate, 'file activation')

          text = replace_once(
              text,
              '        // Handle the red-mode per-Pokemon action menu (Move / Edit / Release / Cancel).\n'
              '        if (storageMenuActive)\n'
              '        {\n'
              '            constexpr int optionCount = 6; // Move, Edit, Clone, Release, Find, Cancel\n',
              '        // Handle the per-Pokemon action menu (Move / Edit / Clone / Export / Release / Find / Cancel).\n'
              '        if (storageMenuActive)\n'
              '        {\n'
              '            constexpr int optionCount = 7;\n',
              'storage menu count')

          text = replace_once(
              text,
              '            // On a party-linked (locked) slot, Move (0) and Release (3) are disabled -- skip them so\n'
              '            // Up/Down never land on a greyed row, and guard the actions below in case a tap slips in.\n'
              '            const bool menuLocked = storageSlotLocked(menuPane, menuBox, menuSlot);\n'
              '            auto menuDisabled = [&](int menuIndex)\n'
              '            { return menuLocked && (menuIndex == 0 || menuIndex == 3); };\n'
              '            // Find (4) and Cancel (5) act on neither the slot nor the save, so a locked slot never\n'
              '            // greys them.\n',
              '            // On a party-linked (locked) slot, only Move (0) and Release (4) are disabled.\n'
              '            // Export is read-only and therefore remains available even for a locked slot.\n'
              '            const bool menuLocked = storageSlotLocked(menuPane, menuBox, menuSlot);\n'
              '            auto menuDisabled = [&](int menuIndex)\n'
              '            { return menuLocked && (menuIndex == 0 || menuIndex == 4); };\n'
              '            // Export (3), Find (5) and Cancel (6) do not disturb slot ownership.\n',
              'storage menu disabled rows')

          old_cases = '''                case 3: // Release -> confirm (blocked on a party-linked slot)
                    if (menuLocked)
                        break;
                    releaseGroup = false;
                    releasePane = menuPane;
                    releaseBox = menuBox;
                    releaseSlot = menuSlot;
                    releaseConfirmActive = true;
                    break;
                case 4: // Find -> highlight matching Pokemon and jump to the first
                    // The grids highlight straight from the query, so matches light up while it is
                    // typed. The cursor jumps only once it is accepted: jumping per key would move
                    // the bank's current box, which is an unsaved bank change.
                    if (storageSearch.promptForQuery("Box and Bank", ListSearch::FilterTiming::WhileTyping))
                    {
                        if (storageSearch.isFiltering() && !jumpToFirstStorageMatch())
                            postStatus("No Pokemon here match that search.", 240);
                    }
                    break;
'''
          new_cases = '''                case 3: // Export -> verified native .pk*/.pb*/.pa* file; source stays untouched
                    if (const Pokemon::Pokemon *source = storageSlot(menuPane, menuBox, menuSlot).get())
                    {
                        std::string error;
                        const std::string path = Trainer::PokemonFile::defaultExportPath(*source);
                        if (!path.empty() && Trainer::PokemonFile::write(*source, path, &error))
                        {
                            postStatus("Exported " + leafName(path) + " to sdmc:/PKSE/exports.", 360);
                            Utils::logEventToFile("POKEMONFILE action=EXPORT result=OK file=\\\"" +
                                                  leafName(path) + "\\\" " + Utils::briefPokemon(*source));
                        }
                        else
                        {
                            const std::string reason = error.empty() ? "could not create export path" : error;
                            postStatus("Export failed: " + reason, 480);
                            Utils::logEventToFile("POKEMONFILE action=EXPORT result=FAILED reason=\\\"" + reason +
                                                  "\\\" " + Utils::briefPokemon(*source));
                        }
                    }
                    break;
                case 4: // Release -> confirm (blocked on a party-linked slot)
                    if (menuLocked)
                        break;
                    releaseGroup = false;
                    releasePane = menuPane;
                    releaseBox = menuBox;
                    releaseSlot = menuSlot;
                    releaseConfirmActive = true;
                    break;
                case 5: // Find -> highlight matching Pokemon and jump to the first
                    // The grids highlight straight from the query, so matches light up while it is
                    // typed. The cursor jumps only once it is accepted: jumping per key would move
                    // the bank's current box, which is an unsaved bank change.
                    if (storageSearch.promptForQuery("Box and Bank", ListSearch::FilterTiming::WhileTyping))
                    {
                        if (storageSearch.isFiltering() && !jumpToFirstStorageMatch())
                            postStatus("No Pokemon here match that search.", 240);
                    }
                    break;
'''
          text = replace_once(text, old_cases, new_cases, 'storage export action')
          screen_path.write_text(text)

          panel_path = Path('src/UI/Panels/StoragePanel.cpp')
          panel = panel_path.read_text()
          panel = replace_once(
              panel,
              '            static const char *const items[] = {"Move", "Edit", "Clone", "Release", "Find…", "Cancel"};\n',
              '            static const char *const items[] = {"Move", "Edit", "Clone", "Export", "Release", "Find…", "Cancel"};\n',
              'storage menu labels')
          panel = replace_once(
              panel,
              '            const uint32_t disabled = locked ? ((1u << 0) | (1u << 3)) : 0u; // Move (0), Release (3)\n'
              '            drawPopupMenu(screen, framebuffer, title, items, 6, screen.storageMenuIndex, disabled);\n',
              '            const uint32_t disabled = locked ? ((1u << 0) | (1u << 4)) : 0u; // Move (0), Release (4)\n'
              '            drawPopupMenu(screen, framebuffer, title, items, 7, screen.storageMenuIndex, disabled);\n',
              'storage menu render count')
          panel_path.write_text(panel)
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-pokemon-file-ui.yml

      - name: Commit UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UI/TrainerViewScreen.cpp src/UI/Panels/StoragePanel.cpp
          git commit -m "feat(storage): wire native Pokemon file import and export"
          git push origin HEAD:feature/pokemon-file-import-export
