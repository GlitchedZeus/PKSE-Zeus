name: Validate PKHeX file compatibility fix

on:
  push:
    branches: [feature/pokemon-file-import-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned devkitA64
        run: docker pull devkitpro/devkita64:20260219
      - name: Full project warning gate
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            devkitpro/devkita64:20260219 python3 tools/syntax_check.py --warnings -j 4
      - name: Generate PKSE runtime assets
        run: |
          python3 -m venv .asset-venv
          .asset-venv/bin/pip install --disable-pip-version-check pillow
          .asset-venv/bin/python tools/gen_fonts.py
          .asset-venv/bin/python tools/gen_typeicons.py
          .asset-venv/bin/python tools/gen_marks.py
          .asset-venv/bin/python tools/gen_hdsprites.py
      - name: Full PKSE build
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            devkitpro/devkita64:20260219 make -j 4
          sha256sum PKSE.nro
      - name: Upload Switch hardware candidate
        uses: actions/upload-artifact@v4
        with:
          name: PKSE-128-plaintext-candidate
          path: PKSE.nro
          if-no-files-found: error
          retention-days: 14
      - name: Collect independent PKHeX fixtures for hardware testing
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          from tools.pkhex_source import pkhex_repo, pkhex_ref
          root = pathlib.Path(pkhex_repo())
          src = root / 'Tests' / 'PKHeX.Core.Tests' / 'Legality'
          if not src.is_dir():
              raise SystemExit(f'PKHeX fixture folder missing: {src}')
          suffixes = {'.pk1','.pk2','.pk3','.pk4','.pk5','.pk6','.pk7','.pb7','.pk8','.pb8','.pa8','.pk9','.pa9'}
          files = [x for x in src.rglob('*') if x.is_file() and x.suffix.lower() in suffixes]
          files.sort()
          chosen = []
          formats = {}
          for path in files:
              key = (path.suffix.lower(), path.stat().st_size)
              if formats.get(key, 0) >= 2: continue
              formats[key] = formats.get(key, 0) + 1
              chosen.append(path)
          if not chosen: raise SystemExit('No native PKHeX fixtures found')
          with zipfile.ZipFile('PKHeX-128-fixtures.zip', 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for path in chosen: z.write(path, path.relative_to(src))
              z.writestr('PKHEX_SOURCE.txt', 'PKHeX ' + pkhex_ref() + '\\n')
          print('Selected',len(chosen),'independent reference files across',len(formats),'format-size groups')
          PY
      - name: Upload reference files for Switch testing
        if: success() && hashFiles('PKHeX-128-fixtures.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PKSE-128-reference-test-files
          path: PKHeX-128-fixtures.zip
          retention-days: 14
